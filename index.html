/* =========================================================
   COLOURS. Light by default; dark with the ☾ button.
   Soft grey page, white rounded cards, black pills, blue main buttons.

:root{
  color-scheme:light;
  --accent:#0B5CFF;--on-accent:#fff;--accent-hover:#0049D6;
  --solid:#0E0F12;--on-solid:#fff;

  --danger:#C0261A;--ok-bg:#EEF1F6;--ok-ink:#2E3440;
  --haze-a:#FFF4DB;--haze-b:#FFE9BC;--haze-line:#D99A2B;--haze-ink:#5A3D00;

}

  --accent:#2F6BFF;--on-accent:#fff;--accent-hover:#4A7EFF;
  --solid:#F2F3F5;--on-solid:#0E0F12;
  --bg:#0B0C10;--card:#16181D;--cardline:#22252C;--field:#1F2229;
  --ink:#F2F3F5;--muted:#A4A9B4;--muted2:#9097A3;--line:#262931;--line2:#383C46;
  --soft:#1A2440;--soft-line:#2E3D66;--soft-ink:#A9C1FF;--soft2:#1F2229;
  --seg:#1F2229;--seg-on:#F2F3F5;--seg-on-ink:#0E0F12;
  --need-bg:#3A2A12;--need-ink:#F2C98F;--need-line:#6E5320;--dot:#E89A45;

}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
a{color:var(--accent)}
.hide{display:none!important}

/* Header */
.hdr{background:var(--bg);color:var(--ink);padding:calc(12px + env(safe-area-inset-top)) 16px 2px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:30;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:44px;height:44px;border-radius:12px;display:block;flex-shrink:0;box-shadow:var(--lift)}
.hdr h1{margin:0;font-size:17px;font-weight:800;white-space:nowrap}
.hdr .sub{font-size:12px;color:var(--muted)}
.hdr .names{display:none}
.hdr-r{display:flex;align-items:center;gap:8px;min-width:0}
.who{height:44px;max-width:min(52vw,240px);min-width:0;border-radius:22px;border:0;background:var(--card);color:var(--ink);font-weight:800;font-size:15px;padding:0 14px;box-shadow:var(--lift)}
.who option{color:#0E0F12;background:#fff}
.theme{font-size:20px;line-height:1}
.hello{padding:8px 0 4px;display:flex;flex-direction:column;gap:2px}
.hello .over{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hello h2{margin:0;font-size:30px;line-height:1.12;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.hello p{margin:0;font-size:20px;line-height:1.25;font-weight:700;color:var(--muted)}
@media (min-width:430px){.hdr .names{display:block}.hello .over{display:none}}

/* Tabs: bottom bar on phones, top bar on laptops */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-top:1px solid var(--cardline);padding:6px 6px calc(16px + env(safe-area-inset-bottom))}
.tabs.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border:0;background:transparent;color:var(--muted2);font-size:12px;font-weight:600;cursor:pointer;border-radius:14px;padding:0}
.tabs button .ic{display:inline-flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px}
.tabs button.on{color:var(--ink);font-weight:800}
.tabs button.on .ic{background:var(--solid);color:var(--on-solid)}
.tabs svg{width:22px;height:22px}
.credit{position:fixed;left:0;right:0;bottom:calc(2px + env(safe-area-inset-bottom));text-align:center;font-size:10px;color:var(--muted2);z-index:41;pointer-events:none}

main{max-width:760px;margin:0 auto;padding:12px 16px calc(110px + env(safe-area-inset-bottom))}
.page{display:none}.page.on{display:block}
.stack{display:flex;flex-direction:column;gap:10px}
.pin-top{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px;padding:8px 16px 8px}

/* Building blocks */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--seg);border-radius:24px;padding:4px}
.seg button{height:42px;border:0;border-radius:21px;background:transparent;color:var(--muted);font-weight:700;font-size:15px;cursor:pointer;padding:0 6px}
.seg button.on{background:var(--seg-on);color:var(--seg-on-ink);font-weight:800}
.card{background:var(--card);border:1px solid var(--cardline);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--lift)}
.card.mine{box-shadow:0 0 0 2px var(--accent) inset;border-color:transparent}
.card.off{background:var(--off-bg);border-color:var(--off-line)}
.card.cxl{opacity:.72}
.card.gone{background:var(--off-bg);border:1.5px dashed var(--off-line);box-shadow:none}
.card.bare{border:0;padding:0;background:transparent;box-shadow:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.when{font-size:14px;font-weight:700;color:var(--muted)}
.ttl{font-size:18px;font-weight:800;overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--muted)}
.muted{color:var(--muted)}
.pills{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:700;white-space:nowrap}
.p-train{background:var(--soft);color:var(--soft-ink)}
.p-match{background:var(--solid);color:var(--on-solid)}
.p-event{background:var(--soft2);color:var(--soft-ink);border:1px solid var(--soft-line)}
.p-need{background:var(--need-bg);color:var(--need-ink)}
.p-ok{background:var(--ok-bg);color:var(--ok-ink)}
.p-off{background:var(--off-bg);color:var(--off-ink);border:1px solid var(--off-line)}
.p-post{background:var(--off-bg);color:var(--off-ink);border:1px dashed var(--muted2)}
.p-cxl{background:var(--off-bg);color:var(--danger)}
.p-haze{background:#C27A12;color:#fff}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;min-height:30px}
.line b{font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:22px;border:0;padding:0 18px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.full{width:100%}
.btn.big{height:54px;font-size:17px;border-radius:27px}
.b-pri{background:var(--accent);color:var(--on-accent)}
.b-pri:hover{background:var(--accent-hover)}
.b-out{background:var(--field);color:var(--ink)}
.b-out:hover{background:var(--line2)}
.b-grey{background:transparent;color:var(--ink);border:1.5px solid var(--line2)}
.b-red{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.b-redfill{background:#C0261A;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:transparent;color:var(--accent);font-weight:800;font-size:14px;padding:6px 0;cursor:pointer;min-height:36px}
.empty{background:var(--card);border-radius:22px;padding:22px 16px;text-align:center;color:var(--muted);font-size:15px;border:1px solid var(--cardline)}
.h2{font-size:16px;font-weight:800;color:var(--ink);margin:10px 0 2px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kv div{background:var(--field);border-radius:14px;padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.kv span{font-size:11px;font-weight:700;color:var(--muted)}
.kv strong{font-size:15px}
.icon-btn{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);color:var(--ink);box-shadow:var(--lift);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .t{text-align:center}.nav .t b{display:block;font-size:19px;font-weight:800}.nav .t span{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{height:40px;padding:0 16px;flex-shrink:0;border-radius:20px;border:0;background:var(--card);box-shadow:var(--lift);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--solid);color:var(--on-solid);font-weight:800}
.meter{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:22px;background:var(--card);border:1px solid var(--cardline);cursor:pointer;width:100%;text-align:left;color:var(--ink)}
.meter .bar{height:8px;border-radius:4px;background:var(--seg);overflow:hidden;display:block}
.meter .bar i{display:block;height:8px;background:var(--accent)}
.big-n{font-size:22px;font-weight:800;white-space:nowrap}.big-n small{font-size:14px;color:var(--muted);font-weight:700}

/* Air quality */
.air{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:10px 14px;border-radius:18px;font-size:14px;font-weight:700;background:var(--soft2);color:var(--soft-ink)}
.air .n{display:inline-flex;gap:6px;margin-left:auto}
.air .n b{background:var(--solid);color:var(--on-solid);padding:2px 9px;border-radius:9px}
.air.na{background:var(--off-bg);color:var(--off-ink)}
.haze-elevated{background:repeating-linear-gradient(135deg,var(--haze-a) 0 12px,var(--haze-b) 12px 24px)!important;box-shadow:inset 0 0 0 1.5px var(--haze-line)!important;color:var(--haze-ink)}
.haze-high{background:repeating-linear-gradient(135deg,var(--hi-a) 0 12px,var(--hi-b) 12px 24px)!important;box-shadow:inset 0 0 0 1.5px var(--hi-line)!important;color:var(--hi-ink)}
.air-panel{border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.air-panel .t{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800}
.warn{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:700;padding:8px 10px;border-radius:10px}

/* Calendar */
.dow,.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dow span{font-size:13px;font-weight:800;color:var(--muted);text-align:center}
.calwrap{position:relative}
.cell{position:relative;height:66px;border-radius:16px;border:1px solid var(--cardline);background:var(--card);color:var(--ink);padding:6px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;cursor:pointer;text-align:left;overflow:hidden;min-width:0}
.cell .num{font-size:16px;font-weight:800;display:flex;justify-content:space-between;width:100%;align-items:center}
.cell.dim{background:transparent;border-style:dashed;color:var(--muted2);cursor:default}
.cell.has{background:var(--soft);border-color:var(--soft-line)}
.cell.off{background:var(--off-bg);border-color:var(--off-line)}
.cell.today .num>span:first-child{text-decoration:underline;text-underline-offset:3px}
.cell.sel{background:var(--solid);border-color:var(--solid);color:var(--on-solid)}
.marks{display:flex;gap:3px;flex-wrap:wrap}
.mk{font-style:normal;display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 4px;border-radius:6px;font-size:11px;font-weight:800}
.mk.t{background:var(--card);color:var(--soft-ink);border:1px solid var(--soft-line)}
.mk.e{background:var(--soft2);color:var(--soft-ink);border:1px dashed var(--soft-ink)}
.mk.m{background:var(--solid);color:var(--on-solid)}
.mk.x{background:var(--muted2);color:#fff;font-size:9.5px;white-space:nowrap;padding:0 5px;border-radius:6px}
.cell.sel .mk.t{border-color:var(--on-solid)}.cell.sel .mk.e{background:var(--on-solid);color:var(--solid);border-color:var(--solid)}.cell.sel .mk.m{background:var(--on-solid);color:var(--solid)}
.cdot{position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:5px;background:var(--dot);box-shadow:0 0 0 2px var(--card)}
.cchips{display:none}
.pop{position:absolute;z-index:25;width:min(330px,100%);background:var(--card);border:1px solid var(--line2);border-radius:22px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pop .ev{display:flex;flex-direction:column;gap:6px;padding-top:9px;border-top:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;font-weight:600;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Summary bars */
.tbar{display:grid;grid-template-columns:104px minmax(0,1fr) 34px;align-items:center;gap:10px;min-height:40px;font-size:15px}
.tbar .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar .b{position:relative;height:14px;border-radius:7px;background:var(--seg)}
.tbar .b i{display:block;height:14px;border-radius:7px;background:var(--muted2)}
.tbar .b u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.tbar .n{font-weight:800;text-align:right}
.tbar.me .nm{color:var(--soft-ink)}.tbar.me .b i{background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats .card{gap:2px;padding:10px 12px}
.stats span{font-size:12px;font-weight:700;color:var(--muted)}
.stats b{font-size:24px;font-weight:800}
.stats .warnc{background:var(--need-bg);border-color:var(--need-line)}.stats .warnc span,.stats .warnc b{color:var(--need-ink)}

/* Sheets (pop-ups): bottom sheet on phones, centred on laptops */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.5);display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{width:100%;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.sheet>*{flex-shrink:0}
.two>.f{justify-content:flex-end}
.f label.chip{text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--ink)}
.f label.chip.on{color:var(--on-solid);font-weight:800}
.sheet .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h2{margin:0;font-size:22px;font-weight:800}
.x{width:44px;height:44px;border-radius:22px;border:0;background:var(--field);color:var(--ink);font-size:24px;cursor:pointer;flex-shrink:0}
.lbl{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.box{background:var(--field);border-radius:18px;padding:12px 14px}
.grid2{display:grid;grid-template-columns:90px minmax(0,1fr);gap:5px 10px;font-size:15px}
.grid2 span:nth-child(odd){color:var(--muted)}.grid2 span:nth-child(even){font-weight:700}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border-radius:18px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;width:100%;text-align:left;color:var(--ink)}
.opt.on{border:2px solid var(--accent);background:var(--soft2);padding:10.5px 12.5px}
.opt input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex-shrink:0}
.opt .o1{font-weight:800;font-size:16px;display:block}.opt .o2{font-size:14px;color:var(--muted);display:block}
.f{display:flex;flex-direction:column;gap:6px}
.f label,.f .lbl{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.inp{height:50px;border:1.5px solid transparent;border-radius:16px;padding:0 14px;font-weight:600;background:var(--field);color:var(--ink);width:100%}
.inp:focus,.pin:focus{outline:none;border-color:var(--accent)}
textarea.inp{height:auto;padding:10px 12px;line-height:1.5;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pin{height:56px;border:1.5px solid transparent;border-radius:18px;text-align:center;font-weight:700;font-size:22px;letter-spacing:.25em;width:100%;background:var(--field);color:var(--ink)}
.err{display:none;padding:10px 12px;border-radius:14px;background:var(--err-bg);color:var(--err-ink);font-size:14px;font-weight:700;white-space:pre-wrap}
.err.on{display:block}
.note{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:var(--field);border:1.5px solid transparent;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex-shrink:0}
.prev{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:18px;background:var(--field);border:1px dashed var(--soft-line);font-size:15px}

/* Toast */
.toast{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:80;padding:14px 16px;border-radius:18px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.2);display:none;white-space:pre-wrap;cursor:pointer}
.toast.ok{display:block;background:var(--okt-bg);color:var(--okt-ink)}
.toast.bad{display:block;background:var(--err-bg);color:var(--err-ink)}

/* Loading placeholders */
.skel{border-radius:22px;background:linear-gradient(90deg,var(--seg) 0%,var(--bg) 40%,var(--seg) 80%);background-size:300% 100%;animation:sk 1.4s ease-in-out infinite;height:110px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* Admin tab */
.adds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.acols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.acal{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:8px}
.aside{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:10px}
.facts{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 10px;font-size:14px}
.facts>span:nth-child(odd){color:var(--muted)}.facts>span:nth-child(even){font-weight:700;overflow-wrap:anywhere}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.by{flex:1 1 140px;font-size:12.5px;color:var(--muted);min-width:0}
.acts{display:flex;gap:8px;margin-left:auto;flex-shrink:0}
.dlist{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:18px;background:var(--need-bg);color:var(--need-ink);font-size:14px}
.tlink{display:block;background:none;border:0;padding:0;margin:0;text-align:left;color:inherit;font-family:inherit;cursor:pointer;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.tlink:hover{color:var(--accent)}
.cchips [data-act="detail"]{text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.p-sent{background:#E3F2E6;color:#1E5A30}
:root[data-theme="dark"] .p-sent{background:#173A25;color:#BDEBCB}
.pgrow{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:18px;border:0;background:var(--field);color:var(--ink);font-family:inherit;text-align:left;cursor:pointer}
.pgrow .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted2);background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:900;color:transparent;flex-shrink:0}
.pgrow.on{background:#E3F2E6}.pgrow.on .bx{background:#1E7A3C;border-color:#1E7A3C;color:#fff}
:root[data-theme="dark"] .pgrow.on{background:#173A25}
.pgrow b{display:block;font-size:15px}.pgsub{font-size:12.5px;color:var(--muted)}
.pgok{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:18px;background:#E3F2E6;color:#1E5A30;font-size:14px;font-weight:700}
:root[data-theme="dark"] .pgok{background:#173A25;color:#BDEBCB}
.okbox{padding:12px 14px;border-radius:18px;background:var(--field);font-size:14px;font-weight:700}
/* Coach attendance */
.attok{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:16px;background:var(--field);font-size:13.5px}
.attok b{font-size:13px}
.attwait{font-size:13px;color:var(--muted)}
.coach{border:1.5px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px}
.coach .cname{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:800}
.coach .tag{font-size:12px;font-weight:800;color:var(--muted)}
.coach .seg{grid-template-columns:repeat(3,minmax(0,1fr))}
.coach .seg button{height:38px;font-size:14px}
.claim{font-size:12.5px;font-weight:700;padding:8px 10px;border-radius:12px;background:var(--soft);color:var(--soft-ink)}
.claim.none{background:var(--field);color:var(--muted)}
.ctotals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* =========================================================
   LAPTOP (wider than 800px)
   ========================================================= */
@media (min-width:801px){
  .hdr{max-width:1180px;padding:18px 24px 6px}
  .hdr h1{font-size:20px}
  .who{max-width:280px;min-width:220px}
  .tabs,.tabs.five{position:sticky;top:0;bottom:auto;display:flex;justify-content:flex-start;max-width:1180px;margin:0 auto;padding:10px 24px;border-top:0;gap:6px;background:var(--bg)}
  .tabs button{flex-direction:row;gap:4px;min-height:44px;padding:0 18px 0 6px;font-size:15px;border-radius:22px;background:var(--card);box-shadow:var(--lift)}
  .tabs button .ic{width:34px;height:32px;background:transparent!important;color:inherit!important}
  .tabs button.on{background:var(--solid);color:var(--on-solid)}
  .tabs svg{width:20px;height:20px}
  .hello h2{font-size:36px}.hello p{font-size:22px}
  .credit{position:static;text-align:right;max-width:1180px;margin:-40px auto 0;padding:0 24px 20px;font-size:11px}
  main{max-width:1180px;padding:20px 24px 60px}
  .pin-top{top:64px;margin:0;padding:8px 0}
  .list2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
  .narrow{max-width:760px}
  .cell{height:128px;gap:5px;justify-content:flex-start;padding:8px 10px}
  .cell:not(.dim):hover{border:2px solid var(--accent);padding:7px 9px}
  .marks,.cdot{display:none}
  .cchips{display:flex;flex-direction:column;gap:4px;width:100%}
  .cchips i{font-style:normal;display:block;height:24px;line-height:24px;padding:0 8px;border-radius:6px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ct{background:var(--soft);color:var(--soft-ink)}.cm{background:var(--solid);color:var(--on-solid)}.ce{background:var(--soft2);color:var(--soft-ink);border:1px dashed var(--soft-line)}.cx{background:var(--muted2);color:#fff}
  .cell.sel .ct{background:var(--card)}.cell.sel .cm{background:var(--on-solid);color:var(--solid)}
  .cneed{font-size:11.5px;font-weight:800;color:var(--need-ink);background:var(--need-bg);border-radius:6px;padding:1px 7px}
  .cell.sel .cneed{background:var(--need-bg)}
  .dow span{background:var(--solid);color:var(--on-solid);border-radius:18px;padding:9px;font-size:15px}
  .overlay{align-items:center;padding:24px}
  .sheet{max-width:560px;border-radius:28px;max-height:88vh}
  .toast{left:auto;right:24px;bottom:24px;max-width:460px}
}
@media (max-width:800px){
  .cneed{display:none}
  .pop{position:relative;width:100%;margin-top:10px}
}
</style>

  <section id="pg-summary" class="page"></section>
  <section id="pg-admin" class="page"></section>
</main>

<div id="overlay" class="overlay" role="dialog" aria-modal="true"><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast" role="status" data-act="toast"></div>
<div class="credit" aria-hidden="true">Developed by Mr Salihin · Rosyth Football CCA</div>

<script>
/* =========================================================
   STATE
   ========================================================= */
var D = null;                    // data from the sheet (getAppData)
var AIR = null;                  // air quality reading
var ME = '';                     // selected teacher ID
var S = {
  tab: 'schedule', view: 'upcoming', calMonth: '', calSel: '',
  dview: 'upcoming', mfilter: 'All', sview: 'month', skey: '',
  sheet: null, busy: false
};
var AD = { view: 'overview', month: '', sel: '', data: null, loading: false, err: '' };   // Admin tab
var TEACHER_KEY = 'ccaDuty.teacherId', THEME_KEY = 'ccaDuty.theme';
var lastLoad = 0, hiddenAt = 0;

/* =========================================================
   SERVER CALLS
   ========================================================= */
function call(fn, arg) {
  return new Promise(function(resolve, reject) {
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e) {
      reject(new Error(e && e.message ? e.message : String(e)));
    });
    if (arg === undefined) r[fn](); else r[fn](arg);
  });
}

function load(quiet) {
  return call('getAppData').then(function(data) {
    D = data; lastLoad = Date.now(); index();
    document.getElementById('appName').textContent = D.settings.appName || 'Football CCA';
    fillWho(); render();
  }).catch(function(e) {
    if (!quiet) document.getElementById('pg-schedule').innerHTML = '<div class="empty">Unable to load the app data.<br>' + esc(e.message) + '</div>';
  });
}

function loadAir() {
  call('getAirQuality').then(function(a) { AIR = a; if (D && (S.tab === 'schedule')) render(); }).catch(function(e) { AIR = { ok: false, error: e.message }; });
}

paintThemeBtn();
window.addEventListener('load', function() {
  try { ME = localStorage.getItem(TEACHER_KEY) || ''; } catch (e) {}
  load(); loadAir();
  setInterval(function() { if (document.visibilityState === 'visible') loadAir(); }, 10 * 60 * 1000);
});
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
  if (D && !S.sheet && ((hiddenAt && Date.now() - hiddenAt > 60000) || Date.now() - lastLoad > 600000)) load(true);
});

/* =========================================================
   DATA HELPERS
   ========================================================= */
var DUTY_IX = {};
var ATT_IX = {};
function index() {
  DUTY_IX = {}; ATT_IX = {};
  D.duties.forEach(function(d) { var k = d.itemType + '|' + d.itemId; (DUTY_IX[k] = DUTY_IX[k] || []).push(d); });
  (D.attendance || []).forEach(function(a) { var k = a.itemType + '|' + a.itemId; (ATT_IX[k] = ATT_IX[k] || []).push(a); });
}
function dutiesOf(it) { return DUTY_IX[it.kind + '|' + it.id] || []; }
function teacher(id) { return (D.teachers || []).find(function(t) { return t.id === id; }) || null; }
function me() { return teacher(ME); }
function isAdmin() { var t = me(); return !!(t && t.admin); }
function nameOf(id, fallback) { if (id === ME) return 'You'; var t = teacher(id); return t ? t.name : (fallback || 'Unknown'); }

function items() {
  var out = [];
  D.sessions.forEach(function(s) { out.push({ kind: 'SESSION', id: s.id, date: s.date, time: s.start || '', s: s }); });
  D.matches.forEach(function(m) { out.push({ kind: 'MATCH', id: m.id, date: m.date, time: m.kickoff || '', m: m }); });
  return out.sort(function(a, b) { return a.date.localeCompare(b.date) || a.time.localeCompare(b.time) || (a.kind === 'SESSION' ? -1 : 1); });
}
function findItem(kind, id) {
  if (kind === 'MATCH') { var m = D.matches.find(function(x) { return x.id === id; }); return m ? { kind: 'MATCH', id: id, date: m.date, time: m.kickoff, m: m } : null; }
  var s = D.sessions.find(function(x) { return x.id === id; }); return s ? { kind: 'SESSION', id: id, date: s.date, time: s.start, s: s } : null;
}
function isNoCca(it) { return it.kind === 'SESSION' && /^no cca$/i.test(it.s.type); }
function isEvent(it) { return it.kind === 'SESSION' && /^event$/i.test(it.s.type); }
function isCancelledMatch(it) { return it.kind === 'MATCH' && /^cancelled$/i.test(it.m.status); }

/* Duty slots for an item: roles, open count and PM state. */
function slots(it) {
  var ds = dutiesOf(it);
  if (it.kind === 'SESSION') {
    if (isNoCca(it) || !it.s.needed) return { roles: [], open: 0, total: 0, ds: ds };
    var b = ds.filter(function(d) { return d.role === 'DUTY'; });
    return { roles: [{ role: 'DUTY', label: 'Duty', needed: it.s.needed, booked: b }], open: Math.max(0, it.s.needed - b.length), total: it.s.needed, ds: ds };
  }
  if (isCancelledMatch(it)) return { roles: [], open: 0, total: 0, ds: [] };
  var tic = ds.filter(function(d) { return d.role === 'TIC'; });
  var out = { roles: [{ role: 'TIC', label: 'TIC', needed: it.m.ticNeeded, booked: tic }], open: Math.max(0, it.m.ticNeeded - tic.length), total: it.m.ticNeeded, ds: ds, pm: null };
  if (it.m.pmNeeded) {
    var by = tic.find(function(d) { return d.alsoPm; }) || ds.find(function(d) { return d.role === 'PM'; }) || null;
    out.pm = { by: by, alsoTic: !!(by && by.role === 'TIC') };
    if (!by) out.open++;
    if (!(by && by.role === 'TIC')) out.total++;
  }
  return out;
}
function mineOn(it) { return dutiesOf(it).find(function(d) { return d.teacherId === ME; }) || null; }

/* ---------- Coach attendance helpers ---------- */
function coaches() { return D.coaches || []; }
function attOf(it) { return ATT_IX[it.kind + '|' + it.id] || []; }
function coachable(it) { return coaches().length > 0 && !isNoCca(it) && !isCancelledMatch(it); }
function attStart(it) { return it.kind === 'MATCH' ? (it.m.dismissal || it.m.transport || it.m.kickoff || '') : (it.s.start || ''); }
function nowHM() {
  var p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Singapore', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
  var o = {}; p.forEach(function(x) { o[x.type] = x.value; }); return o.hour + ':' + o.minute;
}
/* Can I take (or, as admin, change) this item's coach attendance now? */
function attCanTake(it) {
  if (!coachable(it) || !ME) return false;
  var t = today(), adm = isAdmin();
  if (it.date > t) return false;
  if (!adm && !mineOn(it)) return false;
  if (attOf(it).length && !adm) return false;
  if (it.date === t && !adm && attStart(it) && nowHM() < attStart(it)) return false;
  return true;
}
function hoursBetween(a, b) {
  var x = String(a || '').match(/^(\d{2}):(\d{2})$/), y = String(b || '').match(/^(\d{2}):(\d{2})$/);
  if (!x || !y) return NaN;
  var m = (+y[1] * 60 + +y[2]) - (+x[1] * 60 + +x[2]);
  return m > 0 ? Math.round(m / 60 * 100) / 100 : NaN;
}
/* The box on a card: who came, or the button to take attendance. */
function attBlock(it) {
  if (!coachable(it) || it.date > today()) return '';
  var recs = attOf(it), adm = isAdmin(), mine = mineOn(it);
  if (!mine && !adm) return '';
  if (recs.length) {
    var by = recs[0].changedBy ? 'Changed by ' + recs[0].changedBy : 'Coaches confirmed by ' + (recs[0].confirmedBy || '–');
    var h = '<div class="attok"><b>✓ ' + esc(by) + '</b>' + recs.map(function(a) {
      return '<span>' + esc(a.coachName) + ' · ' + esc(a.status === 'Relief' ? 'Relief Coach' : a.status) + (a.status !== 'Absent' && a.timeIn ? ' · ' + esc(tmRange(a.timeIn, a.timeOut)) + ' · ' + esc(a.hours) + ' h' : '') + '</span>';
    }).join('') + '</div>';
    if (adm) h += '<button type="button" class="btn b-grey full" ' + attr({ act: 'att', kind: it.kind, id: it.id }) + '>Change coach attendance</button>';
    return h;
  }
  if (attCanTake(it)) return '<button type="button" class="btn b-pri full" ' + attr({ act: 'att', kind: it.kind, id: it.id }) + '>Take coach attendance</button>';
  if (it.date === today() && attStart(it)) return '<div class="attwait">Coach attendance opens at ' + esc(tm(attStart(it))) + '.</div>';
  return '';
}

/* =========================================================
   DATES AND TIMES
   ========================================================= */
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
var DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var DAYL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function today() {
  var p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Singapore', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
  var o = {}; p.forEach(function(x) { o[x.type] = x.value; }); return o.year + '-' + o.month + '-' + o.day;
}
function dt(k) { var p = String(k).split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
function key(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(k, n) { var d = dt(k); d.setDate(d.getDate() + n); return key(d); }
function monday(k) { var d = dt(k), w = d.getDay(); d.setDate(d.getDate() + (w === 0 ? -6 : 1 - w)); return key(d); }
function dShort(k) { var d = dt(k); return DAY[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; }
function dLong(k) { var d = dt(k); return DAYL[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()]; }
function tm(t) {
  var m = String(t || '').match(/^(\d{1,2}):(\d{2})/); if (!m) return String(t || '');
  var h = +m[1], ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + ':' + m[2] + ap;
}
function tmRange(a, b) {
  if (!a) return ''; if (!b) return tm(a);
  var x = tm(a), y = tm(b);
  return (x.slice(-2) === y.slice(-2) ? x.slice(0, -2) : x) + '–' + y;
}
function monthKey(k) { return k.slice(0, 7); }
function monthLabel(mk) { var p = mk.split('-'); return MONTH[+p[1] - 1] + ' ' + p[0]; }
function shiftMonth(mk, n) { var p = mk.split('-'); var d = new Date(+p[0], +p[1] - 1 + n, 1, 12); return key(d).slice(0, 7); }

/* =========================================================
   SMALL RENDER HELPERS
   ========================================================= */
function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
/* Light / dark switch, remembered on this device. */
function theme() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  paintThemeBtn();
}
function paintThemeBtn() {
  var b = document.getElementById('themeBtn'), dark = theme() === 'dark';
  if (b) { b.textContent = dark ? '☀' : '☾'; b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode'); }
  var m = document.getElementById('themeColor'); if (m) m.setAttribute('content', dark ? '#0B0C10' : '#F4F5F7');
}
/* Page greeting: big bold line, grey second line. */
function hello(big, small) {
  return '<div class="hello"><span class="over">' + esc((D && D.settings.appName) || 'Football CCA') + '</span><h2>' + esc(big) + '</h2>' + (small ? '<p>' + esc(small) + '</p>' : '') + '</div>';
}
function firstName() { var t = me(); return t ? t.name : ''; }

function attr(o) { return Object.keys(o).map(function(k) { return 'data-' + k + '="' + esc(o[k]) + '"'; }).join(' '); }
var ICON = {
  left: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  warn: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  copy: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  down: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  flag: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V4M4 4h12l-2 4 2 4H4"/></svg>'
};
function shortDiv(d) { return String(d || '').replace(/^Junior/i, 'Jr').replace(/^Senior/i, 'Sr'); }
function typePill(it) {
  if (it.kind === 'MATCH') return '<span class="pill p-match">Match</span>';
  if (isNoCca(it)) return '<span class="pill p-off">No CCA</span>';
  if (isEvent(it)) return '<span class="pill p-event">Event</span>';
  if (/school team/i.test(it.s.type)) return '<span class="pill p-train">School Team</span>';
  return '<span class="pill p-train">Training</span>';
}
function titleOf(it) { return it.kind === 'MATCH' ? it.m.division + ' vs ' + it.m.opponent : (it.s.title || it.s.type); }
function whenOf(it) {
  if (it.kind === 'MATCH') return dShort(it.date) + (it.m.kickoff ? ' · Kick-off ' + tm(it.m.kickoff) : '');
  return dShort(it.date) + (it.s.start ? ' · ' + tmRange(it.s.start, it.s.end) : '');
}

/* =========================================================
   AIR QUALITY (Haze SOP) — warnings for today only
   ========================================================= */
function hazeLevel() { return AIR && AIR.ok && (AIR.level === 'elevated' || AIR.level === 'high') ? AIR.level : ''; }
function itemHaze(it) {
  if (it.date !== today() || isNoCca(it) || isCancelledMatch(it)) return '';
  return hazeLevel();
}
function airHtml() {
  if (!AIR) return '';
  if (!AIR.ok) return '<div class="air na" role="status">' + ICON.warn + '<span>Air quality reading unavailable. Check NEA before outdoor training.</span></div>';
  var when = (AIR.region ? AIR.region.charAt(0).toUpperCase() + AIR.region.slice(1) : '') + (AIR.time && /T(\d{2}:\d{2})/.test(AIR.time) ? ' · NEA ' + AIR.time.match(/T(\d{2}:\d{2})/)[1] : '');
  if (AIR.level === 'normal') return '<div class="air" role="status"><span aria-hidden="true">✓</span><span>Air quality OK</span><span class="n"><b>PSI ' + esc(AIR.psi) + '</b><b>PM2.5 ' + esc(AIR.pm25) + '</b></span></div>';
  var hi = AIR.level === 'high';
  return '<section class="air-panel haze-' + AIR.level + '" role="status" aria-label="Air quality now"><div class="t">' + ICON.warn + '<span>' + (hi ? 'No training today' : 'No outdoor training today') + '</span><span class="pill p-haze" style="margin-left:auto">' + (hi ? 'High' : 'Elevated') + '</span></div>' +
    '<div style="font-size:14px">' + (hi ? 'Haze SOP: no training. ' : 'Haze SOP: train indoors or cancel. ') + 'PSI ' + esc(AIR.psi) + ' · PM2.5 ' + esc(AIR.pm25) + (when ? ' · ' + esc(when) : '') + '</div></section>';
}

/* =========================================================
   ITEM CARD (Upcoming list, calendar pop-up, Matches tab)
   ========================================================= */
function dutyLines(it, compact) {
  var sl = slots(it), h = '', past = it.date < today(), mine = mineOn(it);
  if (isNoCca(it)) return it.s.remarks ? '<div class="sub">' + esc(it.s.remarks) + '</div>' : '';
  if (isCancelledMatch(it)) return '<div class="sub">This match has been cancelled.</div>';
  sl.roles.forEach(function(r) {
    var names = r.booked.map(function(d) { return '<b>' + esc(nameOf(d.teacherId, d.teacherName)) + '</b>' + (d.alsoPm ? ' (also PM)' : ''); }).join(', ');
    var openN = Math.max(0, r.needed - r.booked.length);
    h += '<div class="line"><span>' + r.label + ': ' + (names || '<span class="muted">open</span>') + (names && openN ? ' <span class="muted">· ' + openN + ' more needed</span>' : '') + '</span>' +
      (openN ? '<span class="pill p-need">Needs ' + openN + '</span>' : '<span class="pill p-ok">✓ Full</span>') + '</div>';
    if (openN && !past && !mine) h += '<button type="button" class="btn b-pri full" ' + attr({ act: 'book', kind: it.kind, id: it.id, role: r.role }) + '>Book ' + (r.role === 'TIC' ? 'TIC' : 'Duty') + '</button>';
  });
  if (sl.pm) {
    if (sl.pm.by) h += '<div class="line"><span>PM Duty: <b>' + esc(nameOf(sl.pm.by.teacherId, sl.pm.by.teacherName)) + '</b>' + (sl.pm.alsoTic ? ' <span class="muted">(also TIC)</span>' : '') + '</span><span class="pill p-ok">✓ Covered</span></div>';
    else {
      h += '<div class="line"><span>PM Duty: <span class="muted">' + (sl.roles[0].booked.length ? 'open' : 'TIC will be asked') + '</span></span><span class="pill p-need">Needs PM</span></div>';
      if (!past && !mine && sl.roles[0].booked.length) h += '<button type="button" class="btn b-out full" ' + attr({ act: 'book', kind: it.kind, id: it.id, role: 'PM' }) + '>Book PM Duty</button>';
    }
  }
  if (mine && !compact) h += '<div class="line"><span class="muted">You are on this ' + (it.kind === 'MATCH' ? 'match' : 'duty') + '.</span><button type="button" class="link" data-act="tab" data-tab="duties">My Duties ›</button></div>';
  return h;
}

function itemCard(it, opt) {
  opt = opt || {};
  var hz = itemHaze(it), mine = mineOn(it), cls = 'card';
  if (isNoCca(it)) cls += ' off';
  if (isCancelledMatch(it)) cls += ' cxl';
  if (mine) cls += ' mine';
  if (hz) cls += ' haze-' + hz;
  if (opt.bare) cls = 'card bare';
  var pills = '';
  if (hz) pills += '<span class="pill p-haze">' + ICON.warn + 'Haze</span>';
  if (it.kind === 'MATCH' && it.m.pmNeeded && !isCancelledMatch(it)) pills += '<span class="pill p-ok">PM Duty</span>';
  if (it.kind === 'MATCH' && /postponed/i.test(it.m.status)) pills += '<span class="pill p-post">Postponed</span>';
  if (isCancelledMatch(it)) pills += '<span class="pill p-cxl">Cancelled</span>';
  if (pgSentOf(it)) pills += '<span class="pill p-sent">PG sent</span>';
  pills += typePill(it);
  var sub = '';
  if (it.kind === 'MATCH') sub = [it.m.venue, it.m.round].filter(Boolean).join(' · ');
  else if (!isNoCca(it)) sub = [it.s.groups, it.s.venue].filter(Boolean).join(' · ');
  var h = '<article class="' + cls + '">' +
    '<div class="row"><span class="when">' + esc(whenOf(it)) + '</span><span class="pills">' + pills + '</span></div>' +
    (isNoCca(it) || opt.noLink ? '<div class="ttl">' + esc(isNoCca(it) ? 'No training · ' + titleOf(it) : titleOf(it)) + '</div>'
      : '<button type="button" class="ttl tlink" ' + attr({ act: 'detail', kind: it.kind, id: it.id }) + '>' + esc(titleOf(it)) + '</button>') +
    (sub ? '<div class="sub">' + esc(sub) + '</div>' : '');
  if (hz) h += '<div class="warn haze-' + hz + '">' + ICON.warn + '<span>' + (hz === 'high' ? 'Haze SOP: no training today.' : 'Haze SOP: no outdoor training. Train indoors or cancel.') + '</span></div>';
  if (opt.details && it.kind === 'MATCH' && !isCancelledMatch(it)) {
    h += '<div class="kv"><div><span>Dismissal</span><strong>' + esc(tm(it.m.dismissal) || '–') + '</strong></div><div><span>Bus leaves</span><strong>' + esc(tm(it.m.transport) || '–') + '</strong></div><div><span>Kick-off</span><strong>' + esc(tm(it.m.kickoff) || '–') + '</strong></div></div>';
  }
  if (opt.result && it.kind === 'MATCH' && (it.m.scoreUs !== '' || it.m.result)) {
    h += '<div class="line"><span>Result</span><span class="pill p-match">' + esc((it.m.result ? it.m.result + ' ' : '') + (it.m.scoreUs !== '' ? it.m.scoreUs + '–' + it.m.scoreThem : '')) + '</span></div>';
  }
  h += dutyLines(it, opt.compact);
  if (!opt.compact) h += attBlock(it);
  if (opt.actions) h += opt.actions;
  return h + '</article>';
}

/* =========================================================
   RENDER
   ========================================================= */
function render() {
  if (!D) return;
  var adm = isAdmin();
  if (S.tab === 'admin' && !adm) S.tab = 'schedule';
  document.getElementById('navAdmin').classList.toggle('hide', !adm);
  document.querySelector('.tabs').classList.toggle('five', adm);
  document.querySelectorAll('.tabs button').forEach(function(b) { b.classList.toggle('on', b.getAttribute('data-tab') === S.tab); });
  document.querySelectorAll('.page').forEach(function(p) { p.classList.toggle('on', p.id === 'pg-' + S.tab); });
  if (S.tab === 'schedule') renderSchedule();
  if (S.tab === 'duties') renderDuties();
  if (S.tab === 'matches') renderMatches();
  if (S.tab === 'summary') renderSummary();
  if (S.tab === 'admin') renderAdmin();
}

function fillWho() {
  var sel = document.getElementById('who');
  var list = D.teachers.filter(function(t) { return t.active; });

function upcomingHtml() {

/* ---------- Calendar ---------- */
function calendarHtml() {
  var t = today(), mk = S.calMonth || monthKey(t);
  S.calMonth = mk;
  var first = mk + '-01', start = monday(first);
  var byDate = {};
  items().forEach(function(it) { if (it.date >= start) (byDate[it.date] = byDate[it.date] || []).push(it); });
  var h = '<div class="nav"><button type="button" class="icon-btn" data-act="cal" data-step="-1" aria-label="Previous month">' + ICON.left + '</button><div class="t"><b>' + esc(monthLabel(mk)) + '</b><span>Tap a day for details</span></div><button type="button" class="icon-btn" data-act="cal" data-step="1" aria-label="Next month">' + ICON.right + '</button></div>';
  h += '<div class="dow"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span></div><div class="calwrap" id="calwrap"><div class="cal">';
  var k = start;
  for (var w = 0; w < 6; w++) {
    if (w > 0 && monthKey(k) !== mk) break;
    for (var d = 0; d < 5; d++) {
      var dk = addDays(k, d), inMonth = monthKey(dk) === mk, its = inMonth ? (byDate[dk] || []) : [];
      var off = its.length && its.every(isNoCca);
      var openN = its.reduce(function(a, it) { return a + (it.date >= t ? slots(it).open : 0); }, 0);
      var cls = 'cell' + (!inMonth ? ' dim' : '') + (off ? ' off' : (its.length ? ' has' : '')) + (dk === t ? ' today' : '') + (S.calSel === dk && its.length ? ' sel' : '');
      var marks = '', chips = '';
      if (its.some(function(x) { return x.kind === 'SESSION' && !isNoCca(x) && !isEvent(x); })) marks += '<i class="mk t">T</i>';
      if (its.some(isEvent)) marks += '<i class="mk e">E</i>';
      if (its.some(function(x) { return x.kind === 'MATCH'; })) marks += '<i class="mk m">M</i>';
      if (off) marks += '<i class="mk x">No CCA</i>';
      its.slice(0, 3).forEach(function(x) {
        var c = x.kind === 'MATCH' ? 'cm' : (isNoCca(x) ? 'cx' : (isEvent(x) ? 'ce' : 'ct'));
        var label = x.kind === 'MATCH' ? 'Match · ' + shortDiv(x.m.division) + (isCancelledMatch(x) ? ' (cancelled)' : '') : (isNoCca(x) ? 'No CCA · ' + x.s.title : x.s.title || x.s.type);
        chips += isNoCca(x) ? '<i class="' + c + '">' + esc(label) + '</i>'
          : '<i class="' + c + '" ' + attr({ act: 'detail', kind: x.kind, id: x.id }) + ' title="Open details">' + esc(label) + '</i>';
      });
      if (its.length > 3) chips += '<i class="ct">+' + (its.length - 3) + ' more</i>';
      var aria = dShort(dk) + (its.length ? ': ' + its.map(titleOf).join(', ') + (openN ? ', duty open' : '') : ': no CCA items');
      h += '<button type="button" class="' + cls + '" ' + (inMonth && its.length ? attr({ act: 'day', day: dk }) : 'tabindex="-1"') + ' aria-label="' + esc(aria) + '">' +
        '<span class="num"><span>' + dt(dk).getDate() + '</span>' + (openN ? '<span class="cneed">Duty open</span>' : '') + '</span>' +
        (marks ? '<span class="marks">' + marks + '</span>' : '') + (chips ? '<span class="cchips">' + chips + '</span>' : '') +
        (openN ? '<i class="cdot" aria-hidden="true"></i>' : '') + '</button>';
    }
    k = addDays(k, 7);
  }
  h += '</div>';
  var sel = S.calSel && monthKey(S.calSel) === mk ? (byDate[S.calSel] || []) : [];
  if (sel.length) {
    h += '<section class="pop" id="pop" aria-label="Day details"><div class="row"><b style="font-size:17px">' + esc(dLong(S.calSel)) + '</b><button type="button" class="x" data-act="day" data-day="" aria-label="Close" style="width:36px;height:36px;font-size:20px">×</button></div>';
    sel.forEach(function(it) { h += '<div class="ev">' + itemCard(it, { compact: true, bare: true }) + '</div>'; });
    h += '</section>';
  }
  h += '</div><div class="legend"><span><i class="mk t">T</i>Training</span><span><i class="mk e">E</i>Event</span><span><i class="mk m">M</i>Match</span><span><i class="mk x">No CCA</i>No training</span><span><i style="width:10px;height:10px;border-radius:5px;background:var(--dot);display:inline-block"></i>Duty open</span></div>';
  return h;
}

/* Put the day pop-up next to the chosen day, inside the screen. */
function placePop() {
  var pop = document.getElementById('pop'), wrap = document.getElementById('calwrap');
  if (!pop || !wrap) return;
  var cell = wrap.querySelector('.cell.sel'); if (!cell) return;
  if (window.innerWidth <= 800) {
    // Phone: the details sit under the calendar. Bring them into view above the tab bar.
    var tb = document.querySelector('.tabs'), pin = document.querySelector('#pg-schedule .pin-top');
    var pr0 = pop.getBoundingClientRect(), bottom = window.innerHeight - (tb ? tb.offsetHeight : 0) - 8;
    var topLimit = (pin ? pin.getBoundingClientRect().bottom : 0) + 8;
    if (pr0.bottom > bottom) window.scrollBy({ top: Math.min(pr0.bottom - bottom, pr0.top - topLimit), behavior: 'auto' });
    return;
  }
  var wr = wrap.getBoundingClientRect(), cr = cell.getBoundingClientRect();
  var left = cr.left - wr.left;
  left = Math.max(0, Math.min(left, wr.width - pop.offsetWidth));
  pop.style.left = left + 'px';
  var tabs = document.querySelector('.tabs'), phone = window.innerWidth <= 800;
  var bottomEdge = window.innerHeight - (phone && tabs ? tabs.offsetHeight + 8 : 8);
  var topEdge = 8;
  document.querySelectorAll('.hdr, #pg-schedule .pin-top, .tabs').forEach(function(el) {
    var r = el.getBoundingClientRect();
    if (r.bottom > 0 && r.top < window.innerHeight / 2) topEdge = Math.max(topEdge, r.bottom + 6);
  });
  var h = pop.offsetHeight, roomBelow = bottomEdge - cr.bottom - 6, roomAbove = cr.top - topEdge - 6;
  var above = h > roomBelow && h <= roomAbove;
  if (above) { pop.style.top = 'auto'; pop.style.bottom = (wr.bottom - cr.top + 6) + 'px'; }
  else { pop.style.top = (cr.bottom - wr.top + 6) + 'px'; pop.style.bottom = 'auto'; }
  if (!above && h > roomBelow) {
    // Not enough room either way: scroll so the details sit just above the tab bar.
    var pr = pop.getBoundingClientRect();
    window.scrollBy({ top: Math.min(pr.bottom - bottomEdge, pr.top - topEdge), behavior: 'auto' });
  }
}

/* ---------- Summary ---------- */
function periods(view) {
  var t = today();
  if (view === 'month') {
    var ks = {}; items().forEach(function(it) { ks[monthKey(it.date)] = 1; }); ks[monthKey(t)] = 1;
    return Object.keys(ks).sort().map(function(k) { return { key: k, label: monthLabel(k), sub: (periodOfTerm(k + '-15') || {}).term || '', test: function(d) { return monthKey(d) === k; } }; });
  }
  var terms = (D.terms || []).slice().sort(function(a, b) { return a.start.localeCompare(b.start); });
  if (view === 'term') return terms.map(function(x) { return { key: x.term, label: x.term, sub: x.start && x.end ? dShort(x.start) + ' – ' + dShort(x.end) : '', test: function(d) { return d >= x.start && d <= x.end; } }; });
  var sems = {};
  terms.forEach(function(x) { var k = x.start.slice(0, 4) + '-S' + x.semester; (sems[k] = sems[k] || []).push(x); });
  return Object.keys(sems).sort().map(function(k) {
    var ts = sems[k];
    return { key: k, label: 'Semester ' + k.slice(-1) + ' · ' + k.slice(0, 4), sub: ts.map(function(x) { return x.term; }).join(', '), test: function(d) { return ts.some(function(x) { return d >= x.start && d <= x.end; }); } };

}

  });
  h += '<div style="font-size:13px;padding-top:6px;border-top:1px solid var(--line)" class="muted">Counts training, event, TIC and PM duties. A TIC who is also PM counts once.</div></div>';
  el.innerHTML = h + '</div>';

  call(fn, arg).then(function(r) {

/* ---------- Swap ---------- */
function openSwap(dutyId) {

  var t = today(), it = findItem(d.itemType, d.itemId);

  var opts = D.duties.filter(function(x) {
    if (x.teacherId === ME || x.date < t) return false;
    if (myItems[x.itemType + '|' + x.itemId]) return false;                    // you are already on that item
    return !dutiesOf({ kind: d.itemType, id: d.itemId }).some(function(y) { return y.teacherId === x.teacherId; }); // they are already on yours
  }).sort(byDate);
  var h = sheetTop('Swap duty') + '<div class="lbl">Your duty</div><div class="card" style="background:var(--accent);color:var(--on-accent);border:0"><span style="font-size:14px;font-weight:700;opacity:.85">' + esc(it ? whenOf(it) : dShort(d.date)) + '</span><span style="font-size:17px;font-weight:800">' + esc(roleText(d) + ' · ' + (it ? titleOf(it) : d.title)) + '</span></div>' +
    '<div class="lbl">Swap with</div>';

      var b = document.getElementById('swBtn'); b.disabled = false; b.textContent = 'Swap duties';
    });
  });
}

  return '<button type="button" class="pgrow' + (sent ? ' on' : '') + '" role="checkbox" aria-checked="' + sent + '" ' + attr({ act: 'pgTick', kind: it.kind, id: it.id }) + '><span class="bx">✓</span><span><b>PG sent</b><span class="pgsub">' +

/* "Mark as PG sent" under the PG text (admins). */

  var box = document.getElementById('pgMarkBox'); if (!box) return;
  var list = (S.pgItems || []).map(function(x) { return findItem(x.kind, x.id); }).filter(Boolean);
  if (!isAdmin() || !list.length) { box.innerHTML = ''; return; }
  var n = list.length, word = list[0].kind === 'MATCH' ? (n === 1 ? 'match' : n + ' matches') : 'event';
  if (list.every(pgSentOf)) {
    var o = list[0].kind === 'MATCH' ? list[0].m : list[0].s;
    box.innerHTML = '<div class="pgok"><span>✓ ' + (n === 1 ? 'Marked as PG sent' : 'All ' + n + ' marked as PG sent') + '</span><span style="font-weight:600;font-size:13px">' + esc(pgWho(o)) + '</span></div>' +
      '<button type="button" class="btn b-grey full" data-act="pgMark" data-sent="0">Undo PG sent</button>';
  } else {
    box.innerHTML = '<button type="button" class="btn b-pri big full" data-act="pgMark" data-sent="1">Mark ' + (n === 1 ? 'this ' : 'these ') + word + ' as PG sent</button><p class="note">Admins only. Do this once the notice is out on Parents Gateway.</p>';
  }
}
function pgMark(btn, sent) {

function openPgSelect() {
  var t = today();
  var ms = D.matches.filter(function(m) { return m.date >= t && !/cancelled/i.test(m.status); }).sort(byDate);
  var groups = {}; ms.forEach(function(m) { var r = m.round || 'No round'; (groups[r] = groups[r] || []).push(m); });
  var h = sheetTop('PG text', 'Group of matches') + '<div class="note" style="text-align:left">Tick matches for one PG notice.</div>';
  if (!ms.length) h += '<div class="empty">No upcoming matches.</div>';
  Object.keys(groups).forEach(function(r, gi) {
    h += '<div class="row"><b style="color:var(--soft-ink)">' + esc(r) + '</b><button type="button" class="btn b-out" style="height:36px" data-act="pgAll" data-g="' + gi + '">Select all</button></div><div class="stack">' +
      groups[r].map(function(m) {
        return '<label class="opt" data-pgl="' + esc(m.id) + '"><input type="checkbox" class="pgPick" data-g="' + gi + '" value="' + esc(m.id) + '"><span style="flex:1;min-width:0"><span class="row"><span class="when">' + esc(dShort(m.date)) + '</span>' + (/postponed/i.test(m.status) ? '<span class="pill p-post">Postponed</span>' : '') + '</span><span class="o1">' + esc(m.division + ' vs ' + m.opponent) + '</span><span class="o2">' + esc([m.venue, m.kickoff ? 'Kick-off ' + tm(m.kickoff) : ''].filter(Boolean).join(' · ')) + '</span>' +
          (m.pgSent ? '<span class="pill p-sent" style="align-self:flex-start;margin-top:3px">✓ PG sent · ' + esc(pgWho(m).replace(/^Sent by /, '')) + '</span>' : '') + '</span></label>';
      }).join('') + '</div>';
  });
  h += '<button type="button" class="btn b-pri big full" id="pgGo" data-act="pgMake" disabled>Tick at least one match</button><p class="note">Shows confirmed and postponed matches.</p>';
  openSheet({ kind: 'pgsel' }, h);
  document.querySelectorAll('.pgPick').forEach(function(c) { c.addEventListener('change', pgPickChanged); });
}
function pgPickChanged() {
  var n = 0;
  document.querySelectorAll('.pgPick').forEach(function(c) { c.closest('.opt').classList.toggle('on', c.checked); if (c.checked) n++; });
  var b = document.getElementById('pgGo'); b.disabled = !n; b.textContent = n ? 'Make PG text (' + n + ')' : 'Tick at least one match';
  document.querySelectorAll('[data-act="pgAll"]').forEach(function(btn) {
    var g = btn.getAttribute('data-g'), cs = document.querySelectorAll('.pgPick[data-g="' + g + '"]');
    btn.textContent = Array.prototype.every.call(cs, function(c) { return c.checked; }) ? 'Clear' : 'Select all';
  });
}
function openPgGroup(ids) {
  var list = D.matches.filter(function(m) { return ids.indexOf(m.id) >= 0; }).sort(function(a, b) { return a.date.localeCompare(b.date) || a.kickoff.localeCompare(b.kickoff); });
  var change = '<button type="button" class="btn b-grey" data-act="pgSelect">Change matches</button>';
  S.pgItems = list.map(function(m) { return { kind: 'MATCH', id: m.id }; });
  openSheet({ kind: 'pg' }, pgSheet('PG text · ' + list.length + (list.length === 1 ? ' match' : ' matches'), '', pgGroup(list), change));
  paintPgMark();
}
function pgCopy() {
  var text = S.pg ? S.pg.title + '\n\n' + S.pg.body : '';
  var done = function() { toast('Copied. Paste it into PG.'); };
  var fallback = function() {
    var ta = document.getElementById('pgBody');
    var tmp = document.createElement('textarea'); tmp.value = text; tmp.setAttribute('readonly', ''); tmp.style.position = 'fixed'; tmp.style.opacity = '0';
    document.body.appendChild(tmp); tmp.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(tmp);
    if (ok) done(); else { if (ta) { ta.focus(); ta.select(); } toast('Copy did not work here. The text is selected: copy it from your keyboard or long-press it.', true); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
function pgSave() {
  if (!S.pg) return;
  var text = S.pg.title + '\r\n\r\n' + S.pg.body.replace(/\n/g, '\r\n');
  var name = S.pg.title.replace(/[^A-Za-z0-9 ()-]+/g, ' ').replace(/\s+/g, ' ').trim() + '.txt';
  try {
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Saved ' + name + '. If nothing downloaded, use Copy text instead.');
  } catch (e) { toast('Download did not work here. Use Copy text instead.', true); }
}

/* =========================================================
   ONE CLICK HANDLER FOR EVERYTHING
   ========================================================= */
document.addEventListener('click', function(e) {
  if (e.target === document.getElementById('overlay')) { if (!S.busy) closeSheet(); return; }
  var b = e.target.closest && e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  var a = b.getAttribute('data-act'), g = function(k) { return b.getAttribute('data-' + k); };
  switch (a) {
    case 'tab': closeSheet(); S.tab = g('tab'); render(); window.scrollTo(0, 0); if (S.tab === 'admin') loadAdmin(); break;
    case 'theme': setTheme(theme() === 'dark' ? 'light' : 'dark'); break;
    case 'aview': AD.view = g('view'); renderAdmin(); break;
    case 'acmonth': AD.cmonth = shiftMonth(AD.cmonth || monthKey(today()), +g('step')); renderAdmin(); break;
    case 'att': openAttendance(g('kind'), g('id')); break;
    case 'attSet': ATT.rows[+g('i')].status = g('v'); attPaint(+g('i')); break;
    case 'doAtt': doAttendance(b); break;
    case 'amonth': AD.month = shiftMonth(AD.month || monthKey(today()), +g('step')); AD.sel = ''; renderAdmin(); break;
    case 'aday': AD.sel = g('day') === AD.sel ? '' : g('day'); renderAdmin(); break;
    case 'adel': openDelete(g('kind'), g('id')); break;
    case 'doDel': if (!pinVal()) { showErr('Please enter your admin PIN.'); break; } run(b, 'deleteItem', { teacherId: ME, pin: pinVal(), kind: g('kind'), id: g('id') }); break;
    case 'arest': openRestore(g('kind'), g('id')); break;
    case 'doRest': if (!pinVal()) { showErr('Please enter your admin PIN.'); break; } run(b, 'restoreItem', { teacherId: ME, pin: pinVal(), kind: g('kind'), id: g('id') }); break;
    case 'view': S.view = g('view'); S.calSel = ''; render(); break;
    case 'cal': S.calMonth = shiftMonth(S.calMonth || monthKey(today()), +g('step')); S.calSel = ''; render(); break;
    case 'day': S.calSel = g('day') === S.calSel ? '' : g('day'); renderSchedule(); break;
    case 'dview': S.dview = g('view'); render(); break;
    case 'mfilter': S.mfilter = g('div'); render(); break;
    case 'sview': S.sview = g('view'); S.skey = ''; render(); break;
    case 'snav': var ps = periods(S.sview), i = ps.findIndex(function(p) { return p.key === S.skey; }) + +g('step'); if (ps[i]) { S.skey = ps[i].key; render(); } break;
    case 'book': openBook(g('kind'), g('id'), g('role')); break;
    case 'doBook': doBook(b); break;
    case 'cancel': openCancel(g('duty')); break;
    case 'doCancel': if (!pinVal()) { showErr('Please enter your PIN.'); break; } run(b, 'cancelDuty', { teacherId: ME, pin: pinVal(), dutyId: g('duty') }); break;
    case 'swap': openSwap(g('duty')); break;
    case 'doSwap':
      var pick = document.querySelector('input[name="sw"]:checked');
      if (!pick) { showErr('Choose a duty to swap with.'); break; }
      if (!pinVal()) { showErr('Please enter your PIN.'); break; }
      run(b, 'swapDuty', { teacherId: ME, pin: pinVal(), dutyId: g('duty'), otherDutyId: pick.value }); break;
    case 'matchForm': openMatchForm(g('id')); break;
    case 'doMatch': if (!pinVal()) { showErr('Please enter your admin PIN.'); break; } doMatch(b); break;
    case 'eventForm': openEventForm(g('id')); break;
    case 'doEvent': if (!pinVal()) { showErr('Please enter your admin PIN.'); break; } doEvent(b); break;
    case 'doRemoveEvent': if (!pinVal()) { showErr('Please enter your admin PIN to remove the event.'); break; } run(b, 'removeEvent', { teacherId: ME, pin: pinVal(), id: g('id') }); break;
    case 'pgOne': openPgOne(g('id')); break;
    case 'pgEv': openPgEvent(g('id')); break;
    case 'detail': e.preventDefault(); e.stopPropagation(); clearTimeout(hoverTimer); openDetail(g('kind'), g('id')); break;
    case 'pgTick': pgTick(b, g('kind'), g('id')); break;
    case 'pgMark': pgMark(b, g('sent') === '1'); break;
    case 'pgSelect': openPgSelect(); break;
    case 'pgAll':
      var cs = document.querySelectorAll('.pgPick[data-g="' + g('g') + '"]'), all = Array.prototype.every.call(cs, function(c) { return c.checked; });
      cs.forEach(function(c) { c.checked = !all; }); pgPickChanged(); break;
    case 'pgMake': openPgGroup(Array.prototype.map.call(document.querySelectorAll('.pgPick:checked'), function(c) { return c.value; })); break;
    case 'pgCopy': pgCopy(); break;
    case 'pgSave': pgSave(); break;
    case 'close': if (!S.busy) closeSheet(); break;
    case 'toast': b.className = 'toast'; break;
  }
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && S.sheet && !S.busy) closeSheet();
});
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') {
